<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterMapcer</title>
    <link rel="stylesheet" href="../css/public.css">
    <link rel="icon" type="image/jpg" href="../favicon.png">
</head>
<body>
    <div id="pagePreloader" class="preloader">
        <div class="loader"></div>
    </div>
    <div id="root">
        <div class="flex flex-col">
            <header>
                <div id="headerLeft">
                    <div class="menu-btn" id="mainEmblem">✦</div>
                    <div>
                        <div id="siteTitle">Intermapcer</div>
                        <div id="siteSubtitle">Realm Atlas</div>
                    </div>
                </div>
                <div id="headerMid">
                    <form id="mapTitleForm">
                        <input readonly id="mapTitleInput" type="text" placeholder="Map Title">
                    </form> 
                </div>
                <div id="headerRight">
                    <div id="userInfo">You are: Reader</div>
                    <div>✦</div>
                    <div id="logoutBtn" class="logout-btn"><a>Register</a></div>
                </div>  
            </header>
            <div id="main">
                <!-- Контейнер для просмотра -->
                <div id="viewArea">
                    <div id="imageWrapper">
                        <img id="fullPreview" src="" alt="Preview">
                        <div id="markersLayer"></div>
                    </div>
                </div>
                <div id="legend">
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(139, 26, 26)">☠</span>
                        <span class="legend-text">DUNGEON</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(201, 148, 26);">⚗</span>
                        <span class="legend-text">TAVERN</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(196, 169, 106);">⌂</span>
                        <span class="legend-text">TOWN</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(232, 213, 163);">★</span>
                        <span class="legend-text">LANDMARK</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(204, 51, 51);">⚔</span>
                        <span class="legend-text">DANGER</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px;">📜</span>
                        <span class="legend-text">QUEST</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(122, 106, 74);">◆</span>
                        <span class="legend-text">CAVE</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 18px; color: rgb(106, 158, 181); font-weight: 500;">⌖</span>
                        <span class="legend-text">RUIN</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(74, 103, 65);">▲</span>
                        <span class="legend-text">CAMP</span>
                    </div>
                    <div class="legend">
                        <span style="font-size: 16px; color: rgb(122, 74, 154);">⊕</span>
                        <span class="legend-text">PORTAL</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/public.js"></script>
</body>
</html>
